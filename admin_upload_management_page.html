<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Studio — little lines.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f2e9] text-[#27362a] font-sans min-h-screen p-4 sm:p-8">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-2xl shadow-xl border border-[#ded6c5] text-center">
    <div class="w-12 h-12 bg-[#2d4030]/10 text-[#2d4030] rounded-full flex items-center justify-center mx-auto text-xl mb-4">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h1 class="text-2xl font-serif font-bold text-[#2d4030] mb-2">Admin Portal</h1>
    <p class="text-xs text-[#536456] mb-6">Enter admin passcode to upload and manage portfolio items.</p>

    <form onsubmit="verifyPasscode(event)" class="space-y-4">
      <input type="password" id="passcode-input" placeholder="Passcode" required class="w-full text-center tracking-widest bg-[#f5f2e9]/50 border border-[#ded6c5] rounded-xl px-4 py-3 text-lg text-[#2d4030] focus:outline-none focus:ring-1 focus:ring-[#2d4030]">
      <p id="auth-error" class="text-xs text-rose-600 hidden">Incorrect passcode.</p>
      <button type="submit" class="w-full py-3 bg-[#2d4030] text-white rounded-xl text-sm font-medium hover:bg-[#1f2d22]">Unlock Studio</button>
    </form>
    <a href="index.html" class="block mt-4 text-xs text-[#536456] underline">← Back to Portfolio</a>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="max-w-5xl mx-auto hidden space-y-8">
    <div class="flex items-center justify-between pb-4 border-b border-[#ded6c5]">
      <div>
        <h1 class="text-2xl font-serif font-bold text-[#2d4030]">Artwork Studio & Manager</h1>
        <p class="text-xs text-[#536456]">Manage studies displayed on index.html</p>
      </div>
      <div class="flex items-center space-x-3">
        <a href="index.html" class="px-4 py-2 bg-white border border-[#ded6c5] rounded-xl text-xs font-semibold text-[#2d4030] hover:bg-gray-50">View Live Site</a>
        <button onclick="logout()" class="px-4 py-2 bg-rose-600 text-white rounded-xl text-xs font-semibold hover:bg-rose-700">Logout</button>
      </div>
    </div>

    <!-- ADD FORM -->
    <div class="bg-white p-6 rounded-2xl border border-[#ded6c5] shadow-sm">
      <h2 id="form-heading" class="text-lg font-serif font-bold text-[#2d4030] mb-4">Upload / Add New Study</h2>
      <form onsubmit="saveStudy(event)" class="space-y-4">
        <input type="hidden" id="edit-id">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase mb-1">Title</label>
            <input type="text" id="form-title" required class="w-full bg-[#f5f2e9]/50 border border-[#ded6c5] rounded-xl p-2.5 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase mb-1">Category</label>
            <select id="form-category" class="w-full bg-[#f5f2e9]/50 border border-[#ded6c5] rounded-xl p-2.5 text-sm">
              <option value="Anatomy">Anatomy</option>
              <option value="Portraits">Portraits</option>
              <option value="Concepts">Concepts</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase mb-1">Medium & Technique</label>
            <input type="text" id="form-medium" required placeholder="HB Graphite Pencil" class="w-full bg-[#f5f2e9]/50 border border-[#ded6c5] rounded-xl p-2.5 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase mb-1">Year / Date</label>
            <input type="text" id="form-date" required placeholder="2026" class="w-full bg-[#f5f2e9]/50 border border-[#ded6c5] rounded-xl p-2.5 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase mb-1">Image Source</label>
          <div class="space-y-2">
            <input type="file" accept="image/*" onchange="handleFileSelect(event)" class="text-xs file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-[#2d4030] file:text-white cursor-pointer">
            <input type="text" id="form-image" placeholder="Image URL or relative path (e.g. image.jpg)" class="w-full bg-[#f5f2e9]/50 border border-[#ded6c5] rounded-xl p-2.5 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase mb-1">Description / Study Breakdown</label>
          <textarea id="form-desc" rows="3" required class="w-full bg-[#f5f2e9]/50 border border-[#ded6c5] rounded-xl p-2.5 text-sm"></textarea>
        </div>

        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="resetForm()" class="px-4 py-2 border border-[#ded6c5] rounded-xl text-xs font-semibold">Reset</button>
          <button type="submit" class="px-6 py-2 bg-[#2d4030] text-white rounded-xl text-xs font-semibold hover:bg-[#1f2d22]">Save Study</button>
        </div>
      </form>
    </div>

    <!-- EXISTING ITEMS -->
    <div class="space-y-4">
      <h2 class="text-lg font-serif font-bold text-[#2d4030]">Existing Studies Index</h2>
      <div id="item-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'aidan_sketchbook_artworks';
    const ADMIN_CODE = 'Gmao0314';

    function verifyPasscode(e) {
      e.preventDefault();
      if (document.getElementById('passcode-input').value === ADMIN_CODE) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        renderList();
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    }

    function logout() {
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('passcode-input').value = '';
    }

    function getArtworks() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function saveArtworks(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      renderList();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => document.getElementById('form-image').value = e.target.result;
        reader.readAsDataURL(file);
      }
    }

    function saveStudy(e) {
      e.preventDefault();
      const list = getArtworks();
      const id = document.getElementById('edit-id').value;
      const item = {
        id: id ? parseInt(id) : Date.now(),
        title: document.getElementById('form-title').value,
        category: document.getElementById('form-category').value,
        medium: document.getElementById('form-medium').value,
        date: document.getElementById('form-date').value,
        image: document.getElementById('form-image').value || 'image.jpg',
        description: document.getElementById('form-desc').value
      };

      if (id) {
        const idx = list.findIndex(a => a.id === parseInt(id));
        if (idx !== -1) list[idx] = item;
      } else {
        list.unshift(item);
      }

      saveArtworks(list);
      resetForm();
    }

    function editItem(id) {
      const item = getArtworks().find(a => a.id === id);
      if (!item) return;
      document.getElementById('edit-id').value = item.id;
      document.getElementById('form-title').value = item.title;
      document.getElementById('form-category').value = item.category;
      document.getElementById('form-medium').value = item.medium;
      document.getElementById('form-date').value = item.date;
      document.getElementById('form-image').value = item.image;
      document.getElementById('form-desc').value = item.description;
      document.getElementById('form-heading').innerText = "Edit Study #" + id;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(id) {
      if (confirm("Delete this study permanently?")) {
        saveArtworks(getArtworks().filter(a => a.id !== id));
      }
    }

    function resetForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('form-heading').innerText = "Upload / Add New Study";
      document.querySelector('form').reset();
    }

    function renderList() {
      const list = getArtworks();
      document.getElementById('item-list').innerHTML = list.map(item => `
        <div class="bg-white p-4 rounded-xl border border-[#ded6c5] flex space-x-4 items-center justify-between">
          <div class="flex items-center space-x-3 overflow-hidden">
            <img src="${item.image}" class="w-12 h-12 rounded-lg object-cover bg-gray-100 flex-shrink-0">
            <div class="truncate">
              <h4 class="font-serif font-bold text-sm text-[#2d4030] truncate">${item.title}</h4>
              <p class="text-xs text-[#536456]">${item.category} • ${item.date}</p>
            </div>
          </div>
          <div class="flex space-x-2 flex-shrink-0">
            <button onclick="editItem(${item.id})" class="p-2 bg-gray-100 hover:bg-[#2d4030] hover:text-white rounded-lg text-xs"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteItem(${item.id})" class="p-2 bg-rose-50 hover:bg-rose-600 hover:text-white text-rose-600 rounded-lg text-xs"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
